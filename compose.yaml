services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-agent-api}:${IMAGE_TAG:-latest}
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVEN_LABS_API_KEY: ${ELEVEN_LABS_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # AGNO_MONITOR: "True"
      # AGNO_API_KEY: ${AGNO_API_KEY}
      # Используем переменные для подключения к Supabase
      DB_HOST: db.wyehpfzafbjfvyjzgjss.supabase.co
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_DATABASE: ${DB_NAME}
      DB_SCHEME: ${DB_SCHEME}
      PRINT_ENV_ON_LOAD: "True"
      # Redis конфигурация
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
    networks:
      - agent-api
    # Убираем depends_on так как больше не зависим от локальной базы
    # depends_on:
    #   - pgvector
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  agent-api:

# Убираем volumes для локальной базы данных
# volumes:
#   pgdata: